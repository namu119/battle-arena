<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Battle Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    /* 화면 컨테이너 */
    #lobby, #workshop, #battle-screen, #result-screen, #survival-screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 40px;
      padding-bottom: 40px;
      box-sizing: border-box;
    }
    .active { display: flex !important; }

    h1 { color: #e94560; margin-bottom: 20px; font-size: 2em; }
    h2 { color: #e94560; margin-bottom: 15px; }

    .btn {
      background: #e94560;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
      min-height: 44px;
      transition: background 0.2s;
    }
    .btn:hover { background: #c73e54; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .btn-secondary { background: #16213e; border: 1px solid #e94560; }

    input {
      background: #16213e;
      border: 1px solid #444;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 16px;
      margin: 5px;
      min-height: 44px;
    }

    /* 상점 */
    #workshop {
      overflow-y: auto;
      padding: 20px;
      padding-top: 30px;
    }
    .shop-section {
      background: #16213e;
      border-radius: 12px;
      padding: 15px;
      margin: 8px auto;
      width: 95%;
      max-width: 800px;
    }
    .shop-section h3 {
      color: #e94560;
      margin-bottom: 10px;
      font-size: 1.1em;
    }
    .item-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .item-card {
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      flex: 1;
      min-width: 140px;
      transition: border-color 0.2s;
    }
    .item-card:hover { border-color: #e94560; }
    .item-card.selected { border-color: #e94560; background: #1a1a4e; }
    .item-name { font-weight: bold; color: #fff; }
    .item-cost { color: #f0a500; font-size: 0.9em; }
    .item-stats { color: #aaa; font-size: 0.85em; margin-top: 4px; }
    .item-skill { color: #7ec8e3; font-size: 0.85em; margin-top: 4px; }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
    }
    .stat-row label { width: 50px; font-weight: bold; }
    .stat-row input[type=range] { flex: 1; }
    .stat-row span { width: 30px; text-align: center; }

    #workshopBudget {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #1a1a2e;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 8px 16px;
      width: 100%;
    }
    .gold-display {
      color: #f0a500;
      font-size: 1.2em;
      font-weight: bold;
      margin: 0;
    }
    .points-display {
      color: #7ec8e3;
      font-size: 1em;
      margin: 0;
    }
    .stat-val-badge {
      display: inline-block;
      background: #e94560;
      color: #fff;
      font-size: 0.95em;
      font-weight: bold;
      min-width: 28px;
      text-align: center;
      border-radius: 6px;
      padding: 2px 6px;
    }
    .item-card.selected {
      border-color: #e94560;
      background: #1a1a4e;
      box-shadow: 0 0 0 1px #e94560, inset 0 0 12px rgba(233,69,96,0.15);
    }
    .skill-chip.selected {
      border-color: #7ec8e3;
      background: #1a1a4e;
      box-shadow: 0 0 0 1px #7ec8e3;
      color: #fff;
    }
    #workshopCta {
      position: sticky;
      bottom: 0;
      background: linear-gradient(transparent, #1a1a2e 30%);
      padding: 12px 16px 16px;
      width: 100%;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    #resultCards {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
    }
    .enhance-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .enhance-badge {
      background: #0f3460;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.75em;
      color: #7ec8e3;
      white-space: nowrap;
    }

    .skill-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .skill-chip {
      background: #0f3460;
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.9em;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .skill-chip:hover { border-color: #7ec8e3; }
    .skill-chip.selected { border-color: #7ec8e3; background: #1a1a4e; }
    .skill-chip.disabled { opacity: 0.4; cursor: not-allowed; }

    /* 전투 화면 */
    #battle-screen {
      padding: 20px;
      padding-top: 30px;
    }
    #battle-canvas {
      background: #0f3460;
      border: 2px solid #e94560;
      border-radius: 8px;
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 2 / 1;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .hp-bars {
      display: flex;
      gap: 15px;
      margin: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }
    .hp-bar-container {
      text-align: center;
      min-width: 120px;
    }
    .hp-bar-bg {
      background: #333;
      border-radius: 4px;
      height: 14px;
      width: 120px;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.15s;
    }
    .hp-text { font-size: 0.8em; color: #aaa; }
    .char-name { font-size: 0.9em; font-weight: bold; }

    /* 서바이벌 */
    #survival-screen {
      padding: 12px;
      padding-top: 8px;
    }
    #survivalHud {
      width: 100%;
      max-width: 800px;
      margin: 0 auto 6px;
    }
    .survival-hud-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 2px 0;
      flex-wrap: wrap;
    }
    .survival-timer { color: #e94560; font-weight: bold; font-size: 1.2em; }
    .survival-phase { color: #f0a500; font-weight: bold; font-size: 1em; }
    .survival-gold { color: #f0a500; font-size: 1em; }
    .survival-tick-info { color: #aaa; font-size: 0.75em; margin: 2px auto; text-align: center; width: 100%; max-width: 800px; }
    #survival-canvas {
      background: #0f3460;
      border: 2px solid #e94560;
      border-radius: 8px;
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 2 / 1;
      display: block;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .survival-hp-bottom {
      display: flex;
      gap: 8px;
      margin: 8px auto;
      width: 100%;
      max-width: 800px;
      justify-content: space-between;
    }
    .survival-hp-card {
      flex: 1;
      background: #16213e;
      border-radius: 6px;
      padding: 6px 8px;
      text-align: center;
      min-width: 0;
    }
    .survival-hp-card .hp-name {
      font-size: 0.8em;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .survival-hp-card .hp-bar-outer {
      background: #333;
      border-radius: 3px;
      height: 8px;
      margin: 3px 0;
      overflow: hidden;
    }
    .survival-hp-card .hp-bar-inner {
      height: 100%;
      border-radius: 3px;
      transition: width 0.15s;
    }
    .survival-hp-card .hp-info {
      font-size: 0.7em;
      color: #aaa;
    }
    .survival-hp-card.dead { opacity: 0.4; }
    .survival-log {
      width: 100%;
      max-width: 800px;
      max-height: 80px;
      overflow-y: auto;
      margin: 4px auto;
      padding: 4px 8px;
      background: rgba(22,33,62,0.8);
      border-radius: 6px;
      font-size: 0.75em;
      color: #ccc;
      border: 1px solid rgba(126,200,227,0.15);
    }
    .survival-log-entry {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    #survivalNotify {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 10;
      pointer-events: none;
      max-width: 200px;
    }
    .survival-notify-item {
      background: rgba(15,52,96,0.95);
      border: 1px solid #7ec8e3;
      border-radius: 6px;
      padding: 5px 10px;
      margin-bottom: 3px;
      font-size: 0.8em;
      color: #7ec8e3;
      animation: fadeInOut 2.5s forwards;
      word-break: keep-all;
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(-8px); }
      10% { opacity: 1; transform: translateY(0); }
      75% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 결과 */
    .result-card {
      background: #16213e;
      border-radius: 12px;
      padding: 15px 30px;
      margin: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 300px;
    }
    .rank { font-size: 2em; font-weight: bold; }
    .rank-1 { color: #f0a500; }
    .rank-2 { color: #c0c0c0; }
    .rank-3 { color: #cd7f32; }
    .reward-gold { color: #f0a500; font-weight: bold; }

    .player-list {
      background: #16213e;
      border-radius: 8px;
      padding: 10px 20px;
      margin: 10px;
      min-width: 200px;
    }
    .player-entry { padding: 5px 0; }
    .player-ready { color: #4caf50; }
    .player-waiting { color: #f0a500; }

    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; display: flex; align-items: center; justify-content: center;
      z-index: 999; font-size: 1.5em; color: #e94560;
    }
    #loading-overlay.hidden { display: none; }

    /* ── 태블릿 (max-width: 900px) ── */
    @media (max-width: 900px) {
      h1 { font-size: 1.7em; }
      .item-card { min-width: 120px; }
      .result-card { min-width: 240px; padding: 12px 20px; }
      .shop-section { width: 97%; }
      #survival-screen { padding: 12px; }
      .survival-hud-row { gap: 10px; }
      #survivalNotify { max-width: 180px; }
    }

    /* ── 모바일 (max-width: 600px) ── */
    @media (max-width: 600px) {
      h1 { font-size: 1.4em; }
      h2 { font-size: 1.2em; }

      #lobby, #workshop, #battle-screen, #result-screen, #survival-screen {
        padding-top: 16px;
        padding-bottom: 16px;
      }
      #workshop { padding: 12px; padding-top: 20px; padding-bottom: 80px; }

      .shop-section {
        width: 100%;
        margin: 6px 0;
        padding: 12px;
      }

      .item-card {
        min-width: 100%;
        flex: none;
      }

      .item-name { font-size: 0.95em; }
      .item-stats, .item-skill { font-size: 0.8em; }

      .btn {
        padding: 10px 16px;
        font-size: 15px;
      }

      .gold-display { font-size: 1.1em; }
      .points-display { font-size: 1em; }

      .hp-bars {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        padding: 0 4px;
      }
      .hp-bar-container { width: calc(50% - 6px); min-width: 0; }
      .hp-bar-bg { width: 100%; }
      .char-name { font-size: 0.78em; }
      .hp-text { font-size: 0.68em; }

      /* 스탯 슬라이더 터치 타겟 */
      .stat-row { min-height: 44px; gap: 6px; }
      .stat-row input[type=range] { height: 32px; accent-color: #e94560; }
      .stat-val-badge { width: 32px; font-size: 0.9em; }

      /* 패시브 설명 모바일: 선택 시만 표시 */
      .passive-desc { display: none; }
      .item-card.selected .passive-desc {
        display: block;
        font-size: 0.75em;
        color: #999;
        margin-top: 3px;
      }

      /* 닉네임 입력 */
      #playerName { width: 80%; max-width: 280px; text-align: center; }

      /* 알림 모바일 */
      .survival-notify-item { font-size: 0.7em; padding: 3px 6px; }
      #survivalNotify { max-width: 48%; right: 4px; top: 4px; }

      /* 로그 축소 */
      .survival-log { max-height: 48px; font-size: 0.7em; }

      .result-card {
        min-width: auto;
        width: 90%;
        padding: 12px 16px;
      }

      .stat-row label { width: 40px; font-size: 0.9em; }
      .stat-row span { width: 24px; font-size: 0.9em; }

      .skill-chip { font-size: 0.85em; padding: 5px 12px; }

      .player-list { min-width: 0; width: 100%; }

      /* ── 서바이벌 모바일 ── */
      #survival-screen {
        padding: 4px;
        padding-top: 6px;
        align-items: center;
      }
      #survivalHud {
        width: 100%;
        max-width: 100%;
        margin-bottom: 4px;
      }
      .survival-hud-row {
        gap: 6px;
        font-size: 0.82em;
        padding: 0 4px;
      }
      .survival-timer { font-size: 1em; }
      .survival-phase { font-size: 0.82em; }
      .survival-gold { font-size: 0.82em; }
      .enhance-badges { gap: 3px; }
      .enhance-badge { font-size: 0.68em; padding: 2px 4px; }

      #survival-canvas {
        border-width: 1px;
        border-radius: 4px;
        width: calc(100% - 4px);
      }

      #survivalNotify {
        position: fixed !important;
        max-width: 45%;
        right: 4px;
        top: 4px;
        z-index: 50;
      }
      .survival-notify-item {
        font-size: 0.7em;
        padding: 3px 6px;
      }

      /* 서바이벌 HP카드 모바일 */
      .survival-hp-bottom {
        gap: 4px;
        margin: 4px auto;
        width: calc(100% - 8px);
      }
      .survival-hp-card {
        padding: 5px 4px;
        border-radius: 5px;
      }
      .survival-hp-card .hp-name { font-size: 0.72em; }
      .survival-hp-card .hp-bar-outer { height: 7px; margin: 2px 0; }
      .survival-hp-card .hp-info { font-size: 0.62em; }

      /* 서바이벌 로그 모바일: 하단 고정 */
      .survival-log {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 60px;
        max-width: 100%;
        width: 100%;
        margin: 0;
        padding: 4px 8px;
        border-radius: 0;
        font-size: 0.72em;
        background: rgba(10,10,30,0.92);
        border-top: 1px solid rgba(126,200,227,0.2);
        z-index: 40;
      }

      /* 서바이벌 틱 */
      #survivalTickInfo { font-size: 0.7em !important; text-align: center; }

      /* ── 배속 버튼 모바일 ── */
      #speedBtn, #survivalSpeedBtn {
        padding: 5px 10px !important;
        font-size: 12px !important;
        min-height: 36px !important;
        min-width: 44px !important;
      }

      /* ── 전투 화면 모바일 ── */
      #battle-screen {
        padding: 6px;
        padding-top: 8px;
        align-items: center;
      }
      #battle-screen > div:first-child { gap: 6px !important; margin: 6px auto !important; }
      #battle-screen > div:first-child h2 { font-size: 1.05em; }
      #battle-canvas { width: calc(100% - 4px); }

      /* ── 로비 모바일 ── */
      #lobby {
        padding: 20px 12px;
        align-items: center;
      }
      #lobby > div { flex-direction: column; align-items: center; gap: 8px; }
      #lobby .btn { width: 85%; max-width: 300px; }
      #lobby h1 { text-align: center; }

      /* ── 결과 화면 모바일 ── */
      #result-screen { padding: 12px 8px; align-items: center; }
      .result-card { width: calc(100% - 16px) !important; margin: 4px 8px; }
      .rank { font-size: 1.5em; }

      /* ── 워크샵 예산바 모바일 ── */
      #workshopBudget {
        gap: 12px;
        padding: 6px 12px;
        font-size: 0.9em;
      }
      #workshopCta { padding: 10px 12px 14px; }
    }

    /* ── 초소형 모바일 (max-width: 380px) ── */
    @media (max-width: 380px) {
      h1 { font-size: 1.2em; }
      h2 { font-size: 1em; }
      .btn { padding: 8px 12px; font-size: 14px; }
      .item-card { padding: 8px; }
      .item-name { font-size: 0.85em; }
      .shop-section { padding: 10px; }

      /* 서바이벌 HUD */
      .survival-hud-row { gap: 4px; font-size: 0.75em; }
      .enhance-badge { font-size: 0.6em; padding: 1px 3px; }

      /* PvP HP바 */
      .hp-bar-container { width: calc(50% - 4px); }
      .char-name { font-size: 0.72em; }
      .hp-text { font-size: 0.65em; }

      /* 서바이벌 HP카드 */
      .survival-hp-bottom { gap: 3px; }
      .survival-hp-card { padding: 3px 4px; }
      .survival-hp-card .hp-name { font-size: 0.65em; }
      .survival-hp-card .hp-info { display: none; }
      .survival-hp-card .hp-bar-outer { height: 5px; }

      /* 로그: 초소형에서도 하단 고정 유지 */
      .survival-log { max-height: 48px; font-size: 0.65em; }

      /* 전투 */
      #battle-screen > div:first-child { margin: 4px auto !important; gap: 4px !important; }

      /* 로비 */
      #lobby .btn { width: 90%; }
      #lobby > div { gap: 6px; }

      /* 워크샵 */
      #workshopBudget { gap: 8px; padding: 5px 8px; }
      #workshopCta { padding: 8px 8px 12px; }
      .stat-row label { width: 32px; font-size: 0.8em; }

      /* 결과 */
      .result-card { padding: 10px 12px !important; }
      .rank { font-size: 1.3em; }

      /* 로딩 */
      #loading-overlay { padding: 20px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- 로딩 오버레이 -->
  <div id="loading-overlay">데이터 로딩중...</div>

  <!-- 로비 -->
  <div id="lobby">
    <h1>Battle Arena</h1>
    <input id="playerName" placeholder="닉네임" maxlength="10" value="">
    <div style="margin:15px auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:400px">
      <button class="btn" onclick="createRoom()">방 만들기</button>
      <button class="btn btn-secondary" onclick="refreshRooms()">방 목록</button>
      <button class="btn" onclick="soloMode()" style="background:#0f3460;border:1px solid #7ec8e3">혼자 연습 (vs AI)</button>
      <button class="btn" onclick="survivalMode()" style="background:#2d1b69;border:1px solid #e94560">서바이벌 아레나</button>
    </div>
    <div id="roomList"></div>
  </div>

  <!-- 캐릭터 제작소 -->
  <div id="workshop">
    <h2 style="padding:12px 0 4px">캐릭터 제작</h2>
    <div id="workshopBudget">
      <div class="gold-display">💰 <span id="goldDisplay">1000</span>G</div>
      <div class="points-display">포인트: <span id="pointsDisplay">10</span></div>
    </div>

    <!-- 병과 선택 -->
    <div class="shop-section">
      <h3>병과 선택</h3>
      <div class="item-grid" id="classGrid"></div>
    </div>

    <!-- 스탯 배분 -->
    <div class="shop-section">
      <h3>스탯 배분 (10포인트)</h3>
      <div id="statSliders"></div>
    </div>

    <!-- 장비 상점 -->
    <div class="shop-section">
      <h3>투구</h3>
      <div class="item-grid" id="helmetGrid"></div>
    </div>
    <div class="shop-section">
      <h3>갑옷</h3>
      <div class="item-grid" id="armorGrid"></div>
    </div>
    <div class="shop-section">
      <h3>무기</h3>
      <div class="item-grid" id="weaponGrid"></div>
    </div>
    <div class="shop-section">
      <h3>신발</h3>
      <div class="item-grid" id="bootsGrid"></div>
    </div>

    <!-- 스킬 선택 -->
    <div class="shop-section">
      <h3>스킬 선택 (4개 중 3개)</h3>
      <div class="skill-select" id="skillSelect"></div>
    </div>

    <div style="margin: 8px auto; width: 95%; max-width: 800px;">
      <div class="player-list" id="playerList"></div>
    </div>
    <div id="workshopCta">
      <button class="btn" id="submitBtn" onclick="submitBuild()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;font-weight:bold">출전!</button>
      <button class="btn" id="aiBtn" onclick="fightAI()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;background:#0f3460;border:1px solid #7ec8e3">AI와 전투</button>
      <button class="btn" id="survivalBtn" onclick="startSurvival()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;background:#2d1b69;border:1px solid #e94560">서바이벌 시작</button>
    </div>
  </div>

  <!-- 전투 화면 -->
  <div id="battle-screen">
    <div style="display:flex;align-items:center;gap:10px;margin:10px auto;width:100%;max-width:800px">
      <h2 style="margin:0">전투 진행중</h2>
      <button class="btn btn-secondary" id="speedBtn" style="padding:6px 12px;font-size:13px">1x</button>
    </div>
    <div class="hp-bars" id="hpBars"></div>
    <canvas id="battle-canvas"></canvas>
    <div id="tickInfo" style="margin:10px auto;color:#aaa;width:100%;max-width:800px;text-align:center"></div>
  </div>

  <!-- 서바이벌 전투 화면 -->
  <div id="survival-screen">
    <div id="survivalHud">
      <div class="survival-hud-row">
        <div class="survival-timer" id="survivalTimer">5:00</div>
        <div class="survival-phase" id="survivalPhase">Phase 1 - PvE</div>
        <button class="btn btn-secondary" id="survivalSpeedBtn" style="padding:6px 12px;font-size:13px">1x</button>
      </div>
      <div class="survival-hud-row">
        <div class="survival-gold" id="survivalGold">💰 0G</div>
        <div id="survivalEnhance" class="enhance-badges">
          <span class="enhance-badge" id="enh-helmet">투구0</span>
          <span class="enhance-badge" id="enh-armor">갑옷0</span>
          <span class="enhance-badge" id="enh-weapon">무기0</span>
          <span class="enhance-badge" id="enh-boots">신발0</span>
        </div>
      </div>
    </div>
    <div id="survivalTickInfo" class="survival-tick-info"></div>
    <div style="position:relative;width:100%;max-width:800px">
      <canvas id="survival-canvas"></canvas>
      <div id="survivalNotify"></div>
    </div>
    <!-- HP바: 하단 4명 일렬 -->
    <div id="survivalHpBars" class="survival-hp-bottom"></div>
    <!-- 전투 로그 -->
    <div id="survivalLog" class="survival-log"></div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen">
    <h2>전투 결과</h2>
    <div id="resultCards"></div>
    <button class="btn" onclick="backToWorkshop()" style="margin-top:20px">다시 출전</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myName = '';

    // HTML 이스케이프 (XSS 방지)
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ─── 서버에서 데이터 로드 (await 보장) ───
    let classData = {};
    let equipData = {};
    let dataLoaded = false;

    async function loadGameData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        classData = data.classes;
        equipData = data.equipments;
        dataLoaded = true;
        // 데이터 로드 완료
        // 로딩 완료 → 로비 표시
        document.getElementById('loading-overlay').classList.add('hidden');
        document.getElementById('lobby').classList.add('active');
      } catch (e) {
        console.error('데이터 로드 실패', e);
        document.getElementById('loading-overlay').textContent = '데이터 로드 실패. 새로고침 해주세요.';
      }
    }
    loadGameData();

    // ─── 빌드 상태 ───
    let selectedClass = null;
    let stats = { ATK:0, DEF:0, INT:0, SPD:0 };
    let equip = { helmet:null, armor:null, weapon:null, boots:null };
    let selectedSkills = [];
    const INITIAL_GOLD = 1000;
    const STAT_POINTS = 10;
    let soloPlay = false;
    let survivalPlay = false;

    // ─── 화면 전환 ───
    function showScreen(id) {
      document.querySelectorAll('#lobby,#workshop,#battle-screen,#result-screen,#survival-screen').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ─── 로비 ───
    function createRoom() {
      if (!dataLoaded) return;
      myName = document.getElementById('playerName').value.trim() || `전사${Math.floor(Math.random()*999)}`;
      socket.emit('createRoom', myName);
    }
    function refreshRooms() {
      socket.emit('getRooms');
    }
    function joinRoom(roomId) {
      if (!dataLoaded) return;
      myName = document.getElementById('playerName').value.trim() || `전사${Math.floor(Math.random()*999)}`;
      socket.emit('joinRoom', { roomId, playerName: myName });
    }

    socket.on('roomList', (list) => {
      const el = document.getElementById('roomList');
      if (list.length === 0) { el.innerHTML = '<p style="color:#aaa">열린 방 없음</p>'; return; }
      el.innerHTML = list.map(r =>
        `<div style="margin:5px"><button class="btn btn-secondary" data-room-id="${esc(r.id)}">${esc(r.id.slice(-6))} (${Number(r.players)}/${Number(r.max)})</button></div>`
      ).join('');
      el.querySelectorAll('[data-room-id]').forEach(btn => {
        btn.addEventListener('click', () => joinRoom(btn.dataset.roomId));
      });
    });

    function soloMode() {
      if (!dataLoaded) return;
      myName = document.getElementById('playerName').value.trim() || `전사${Math.floor(Math.random()*999)}`;
      soloPlay = true;
      survivalPlay = false;
      showScreen('workshop');
      initWorkshop();
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('aiBtn').style.display = '';
      document.getElementById('survivalBtn').style.display = 'none';
      document.getElementById('playerList').innerHTML = '<b>솔로 모드</b><div class="player-entry player-ready">vs AI 3명</div>';
    }

    function survivalMode() {
      if (!dataLoaded) return;
      myName = document.getElementById('playerName').value.trim() || `전사${Math.floor(Math.random()*999)}`;
      soloPlay = false;
      survivalPlay = true;
      showScreen('workshop');
      initWorkshop();
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('aiBtn').style.display = 'none';
      document.getElementById('survivalBtn').style.display = '';
      document.getElementById('playerList').innerHTML = '<b>서바이벌 아레나</b><div class="player-entry player-ready">PvE → PvP (5분)</div>';
    }

    function startSurvival() {
      try {
        const build = makeBuild();
        if (!build) return;
        build.playerName = myName;
        socket.emit('startSurvival', build);
        document.getElementById('survivalBtn').disabled = true;
        document.getElementById('survivalBtn').textContent = '매칭중...';
      } catch (e) {
        alert('빌드 생성 실패: ' + e.message);
      }
    }

    socket.on('joinedRoom', ({ roomId, players }) => {
      soloPlay = false;
      showScreen('workshop');
      initWorkshop();
      // 멀티: 출전버튼만 표시
      document.getElementById('submitBtn').style.display = '';
      document.getElementById('aiBtn').style.display = 'none';
      updatePlayerList(players);
    });

    socket.on('playerJoined', ({ players }) => updatePlayerList(players));
    socket.on('playerLeft', ({ players }) => updatePlayerList(players));
    socket.on('playerReady', ({ players }) => updatePlayerList(players));

    function updatePlayerList(players) {
      const el = document.getElementById('playerList');
      el.innerHTML = '<b>참가자</b>' + players.map(p =>
        `<div class="player-entry ${p.ready ? 'player-ready' : 'player-waiting'}">${esc(p.name)} ${p.ready ? '✔' : '⏳'}</div>`
      ).join('');
    }

    // ─── 제작소 ───
    function initWorkshop() {
      selectedClass = null;
      stats = { ATK:0, DEF:0, INT:0, SPD:0 };
      equip = { helmet:null, armor:null, weapon:null, boots:null };
      selectedSkills = [];

      renderClasses();
      renderStats();
      renderEquipments();
      renderSkills();
      updateGold();
      validate();
    }

    function renderClasses() {
      const grid = document.getElementById('classGrid');
      grid.innerHTML = Object.entries(classData).map(([name, cls]) =>
        `<div class="item-card" id="class-${name}" onclick="selectClass('${name}')">
          <div class="item-name">${name}</div>
          <div class="item-stats">HP:${cls.baseHP} ATK:${cls.baseATK} DEF:${cls.baseDEF} SPD:${cls.baseSPD}</div>
          <div class="item-skill">패시브: ${cls.passive.name}</div>
          <div class="item-stats passive-desc">${cls.passive.description}</div>
        </div>`
      ).join('');
    }

    function selectClass(name) {
      selectedClass = name;
      document.querySelectorAll('#classGrid .item-card').forEach(el => el.classList.remove('selected'));
      document.getElementById(`class-${name}`).classList.add('selected');
      validate();
    }

    function renderStats() {
      const container = document.getElementById('statSliders');
      const statNames = { ATK: '공격', DEF: '방어', INT: '지능', SPD: '속도' };
      container.innerHTML = Object.entries(statNames).map(([key, label]) =>
        `<div class="stat-row">
          <label>${label}</label>
          <input type="range" min="0" max="10" value="0" id="stat-${key}" oninput="updateStat('${key}', this.value)">
          <span class="stat-val-badge" id="stat-val-${key}">0</span>
        </div>`
      ).join('');
    }

    function updateStat(key, val) {
      val = parseInt(val);
      const others = Object.entries(stats).filter(([k]) => k !== key).reduce((a, [, v]) => a + v, 0);
      if (others + val > STAT_POINTS) {
        val = STAT_POINTS - others;
        document.getElementById(`stat-${key}`).value = val;
      }
      stats[key] = val;
      document.getElementById(`stat-val-${key}`).textContent = val;
      document.getElementById('pointsDisplay').textContent = STAT_POINTS - Object.values(stats).reduce((a, b) => a + b, 0);
      validate();
    }

    function renderEquipments() {
      const slotMap = { helmet:'helmetGrid', armor:'armorGrid', weapon:'weaponGrid', boots:'bootsGrid' };
      for (const [slot, gridId] of Object.entries(slotMap)) {
        const category = slot === 'helmet' ? 'helmets' : slot === 'armor' ? 'armors' : slot === 'weapon' ? 'weapons' : 'boots';
        const grid = document.getElementById(gridId);
        const items = equipData[category];
        if (!items) { grid.innerHTML = '<span style="color:#666">로딩중...</span>'; continue; }
        grid.innerHTML = Object.entries(items).map(([name, item]) => {
          const statsStr = Object.entries(item.stats).map(([k, v]) => `${k}+${v}`).join(' ');
          return `<div class="item-card" id="equip-${name}" onclick="selectEquip('${slot}','${name}')">
            <div class="item-name">${name}</div>
            <div class="item-cost">${item.cost}G</div>
            <div class="item-stats">${statsStr}</div>
            <div class="item-skill">스킬: ${item.skill.name}</div>
          </div>`;
        }).join('');
      }
    }

    function selectEquip(slot, name) {
      const gridId = slot === 'helmet' ? 'helmetGrid' : slot === 'armor' ? 'armorGrid' : slot === 'weapon' ? 'weaponGrid' : 'bootsGrid';
      document.querySelectorAll(`#${gridId} .item-card`).forEach(el => el.classList.remove('selected'));
      document.getElementById(`equip-${name}`).classList.add('selected');

      equip[slot] = name;
      updateGold();
      renderSkills();
      validate();
    }

    function updateGold() {
      let cost = 0;
      const slotCategory = { helmet:'helmets', armor:'armors', weapon:'weapons', boots:'boots' };
      for (const [slot, name] of Object.entries(equip)) {
        if (!name) continue;
        const cat = equipData[slotCategory[slot]];
        if (cat && cat[name]) cost += cat[name].cost;
      }
      const remaining = INITIAL_GOLD - cost;
      document.getElementById('goldDisplay').textContent = remaining;
      document.getElementById('goldDisplay').style.color = remaining < 0 ? '#e94560' : '#f0a500';
    }

    function renderSkills() {
      const container = document.getElementById('skillSelect');
      const candidates = [];
      const slotCategory = { helmet:'helmets', armor:'armors', weapon:'weapons', boots:'boots' };

      for (const [slot, name] of Object.entries(equip)) {
        if (!name) continue;
        const cat = equipData[slotCategory[slot]];
        if (cat && cat[name]) candidates.push(cat[name].skill.name);
      }

      if (candidates.length === 0) {
        container.innerHTML = '<span style="color:#666">장비를 먼저 선택하세요</span>';
        return;
      }

      selectedSkills = selectedSkills.filter(s => candidates.includes(s));

      container.innerHTML = candidates.map(name => {
        const isSelected = selectedSkills.includes(name);
        const isFull = selectedSkills.length >= 3 && !isSelected;
        return `<div class="skill-chip ${isSelected ? 'selected' : ''} ${isFull ? 'disabled' : ''}"
                  data-skill="${esc(name)}">${esc(name)}</div>`;
      }).join('');
      container.querySelectorAll('.skill-chip:not(.disabled)').forEach(chip => {
        chip.addEventListener('click', () => toggleSkill(chip.dataset.skill));
      });
      validate();
    }

    function toggleSkill(name) {
      const idx = selectedSkills.indexOf(name);
      if (idx >= 0) {
        selectedSkills.splice(idx, 1);
      } else if (selectedSkills.length < 3) {
        selectedSkills.push(name);
      }
      renderSkills();
    }

    function validate() {
      const cost = getTotalCost();
      const valid = selectedClass
        && Object.values(equip).every(v => v)
        && selectedSkills.length === 3
        && cost <= INITIAL_GOLD;
      document.getElementById('submitBtn').disabled = !valid;
      document.getElementById('aiBtn').disabled = !valid;
      document.getElementById('survivalBtn').disabled = !valid;
    }

    function getTotalCost() {
      let cost = 0;
      const slotCategory = { helmet:'helmets', armor:'armors', weapon:'weapons', boots:'boots' };
      for (const [slot, name] of Object.entries(equip)) {
        if (!name) continue;
        const cat = equipData[slotCategory[slot]];
        if (cat && cat[name]) cost += cat[name].cost;
      }
      return cost;
    }

    function submitBuild() {
      try {
        const build = makeBuild();
        if (!build) return;
        socket.emit('submitBuild', build);
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = '대기중...';
      } catch (e) {
        console.error('빌드 생성 실패', e);
        alert('빌드 생성 실패: ' + e.message);
      }
    }

    function fightAI() {
      try {
        const build = makeBuild();
        if (!build) return;
        build.playerName = myName;
        socket.emit('fightAI', build);
        document.getElementById('aiBtn').disabled = true;
        document.getElementById('aiBtn').textContent = '매칭중...';
      } catch (e) {
        console.error('빌드 생성 실패', e);
        alert('빌드 생성 실패: ' + e.message);
      }
    }

    function makeBuild() {
      const cls = classData[selectedClass];
      if (!cls) throw new Error('병과를 선택하세요');
      const slotCategory = { helmet:'helmets', armor:'armors', weapon:'weapons', boots:'boots' };
      const STAT_WEIGHT = 3;

      const equipStats = { ATK:0, DEF:0, INT:0, SPD:0 };
      for (const [slot, name] of Object.entries(equip)) {
        if (!name) continue;
        for (const [k, v] of Object.entries(equipData[slotCategory[slot]][name].stats)) {
          if (equipStats[k] !== undefined) equipStats[k] += v;
        }
      }

      return {
        className: selectedClass,
        passive: cls.passive,
        stats: {
          maxHP: cls.baseHP + stats.DEF * 15,
          ATK: cls.baseATK + stats.ATK + equipStats.ATK,
          DEF: cls.baseDEF + stats.DEF + equipStats.DEF,
          INT: stats.INT + (equipStats.INT || 0),
          SPD: cls.baseSPD + stats.SPD + (equipStats.SPD || 0),
        },
        range: cls.range,
        btWeights: {
          survive: cls.btWeights.survive + stats.DEF * STAT_WEIGHT,
          skill: cls.btWeights.skill + stats.INT * STAT_WEIGHT,
          attack: cls.btWeights.attack + stats.ATK * STAT_WEIGHT,
        },
        equip: { ...equip },
        skills: selectedSkills.map(name => {
          for (const [slot, itemName] of Object.entries(equip)) {
            const item = equipData[slotCategory[slot]][itemName];
            if (item.skill.name === name) return { ...item.skill };
          }
          return null;
        }).filter(Boolean),
        cost: getTotalCost(),
      };
    }

    // ─── 전투 화면 ───
    // ─── 배속 컨트롤 ───
    let playbackSpeed = 1;
    const SPEED_OPTIONS = [1, 2, 4];
    const speedBtn = document.getElementById('speedBtn');
    if (speedBtn) {
      speedBtn.addEventListener('click', () => {
        const idx = (SPEED_OPTIONS.indexOf(playbackSpeed) + 1) % SPEED_OPTIONS.length;
        playbackSpeed = SPEED_OPTIONS[idx];
        speedBtn.textContent = playbackSpeed + 'x';
        // Notify server to change tick rate
        socket.emit('setSpeed', playbackSpeed);
      });
    }

    const canvas = document.getElementById('battle-canvas');
    const ctx = canvas.getContext('2d');
    const classColors = { '전사':'#e94560', '마법사':'#7b2ff7', '도적':'#2ecc71', '기사':'#3498db', '궁수':'#f39c12' };
    let battleChars = [];
    let animations = [];
    let animFrameId = null;
    let isBattleActive = false;
    const deadAnimated = new Set(); // track characters whose death animation already played
    const ARENA_WIDTH = 1600;
    const ARENA_HEIGHT = 400;

    // ─── Task 2: Canvas resize (2:1 aspect) ───
    function resizeCanvas() {
      const container = canvas.parentElement;
      const style = getComputedStyle(container);
      const pad = parseFloat(style.paddingLeft || 0) + parseFloat(style.paddingRight || 0);
      const w = Math.min(800, container.clientWidth - Math.max(pad, 10));
      canvas.width = w;
      canvas.height = Math.round(w * 0.5);
    }

    resizeCanvas();
    window.addEventListener('resize', () => {
      resizeCanvas();
      if (battleChars.length > 0 && !isBattleActive) {
        renderFrame();
      }
    });

    // ─── Task 2: Diamond field rendering ───
    function getDiamondParams(W, H) {
      const cx = W / 2;
      const cy = H * 0.62;
      const dw = W * 0.45; // half-width of diamond
      const dh = H * 0.30; // half-height of diamond
      return { cx, cy, dw, dh };
    }

    function drawDiamondField(W, H) {
      const { cx, cy, dw, dh } = getDiamondParams(W, H);

      // Fill background
      ctx.fillStyle = '#0f3460';
      ctx.fillRect(0, 0, W, H);

      // Diamond floor
      ctx.fillStyle = '#0f2847';
      ctx.beginPath();
      ctx.moveTo(cx, cy - dh);       // top
      ctx.lineTo(cx + dw, cy);       // right
      ctx.lineTo(cx, cy + dh);       // bottom
      ctx.lineTo(cx - dw, cy);       // left
      ctx.closePath();
      ctx.fill();

      // Grid lines parallel to diamond edges
      ctx.strokeStyle = '#1a3a5c';
      ctx.lineWidth = 1;
      const gridCount = 6;
      for (let i = 1; i < gridCount; i++) {
        const t = i / gridCount;
        // Lines parallel to top-right edge (from left edge to bottom edge)
        ctx.beginPath();
        const lx1 = cx + (-dw) * (1 - t) + 0 * t;
        const ly1 = cy + 0 * (1 - t) + (-dh) * t;
        const lx2 = cx + 0 * (1 - t) + dw * t;
        const ly2 = cy + dh * (1 - t) + 0 * t;
        ctx.moveTo(lx1, ly1);
        ctx.lineTo(lx2, ly2);
        ctx.stroke();

        // Lines parallel to top-left edge (from right edge to bottom edge)
        ctx.beginPath();
        const rx1 = cx + dw * (1 - t) + 0 * t;
        const ry1 = cy + 0 * (1 - t) + (-dh) * t;
        const rx2 = cx + 0 * (1 - t) + (-dw) * t;
        const ry2 = cy + dh * (1 - t) + 0 * t;
        ctx.moveTo(rx1, ry1);
        ctx.lineTo(rx2, ry2);
        ctx.stroke();
      }
    }

    // ─── Task 3: Coordinate transformation ───
    function serverToQuarterView(serverX, syntheticY, W, H) {
      const { cx, cy, dw, dh } = getDiamondParams(W, H);
      // Normalize server coords to -1..1
      const normX = (serverX / ARENA_WIDTH) * 2 - 1;  // -1 to 1
      const normY = (syntheticY / ARENA_HEIGHT) * 2 - 1; // -1 to 1
      // Isometric projection onto diamond
      const qvX = cx + (normX - normY) * dw * 0.5;
      const qvY = cy + (normX + normY) * dh * 0.5;
      return { qvX, qvY };
    }

    function getDepthScale(qvY, H, isMobile) {
      const { cy, dh } = getDiamondParams(canvas.width, H);
      const minY = cy - dh;
      const maxY = cy + dh;
      const t = Math.max(0, Math.min(1, (qvY - minY) / (maxY - minY)));
      if (isMobile) return 0.85 + t * 0.15; // 0.85-1.0 on mobile
      return 0.8 + t * 0.2; // 0.8-1.0 on desktop
    }

    // ─── Task 4: Geometric character rendering ───
    function drawCharacter(ctx, char, qvX, qvY, scale, deathProgress) {
      const color = char.alive || deathProgress !== undefined
        ? (classColors[char.className] || '#e94560') : '#555';
      const baseSize = 14 * scale;

      ctx.save();
      ctx.translate(qvX, qvY);

      // Death animation: shrink + fade
      if (deathProgress !== undefined) {
        const shrink = 1.0 - deathProgress * 0.7; // 1.0 -> 0.3
        const alpha = 1.0 - deathProgress;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.scale(shrink, shrink);
      } else if (!char.alive) {
        // Ghost state after death animation
        ctx.globalAlpha = 0.3;
      }

      // Shadow ellipse
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 0, baseSize * 1.2, baseSize * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Legs (short stubby legs like reference)
      const legW = baseSize * 0.25;
      const legH = baseSize * 0.4;
      ctx.fillStyle = darkenColor(color, 0.7);
      ctx.fillRect(-baseSize * 0.35, -legH, legW, legH);
      ctx.fillRect(baseSize * 0.1, -legH, legW, legH);

      // Body (thick rounded trapezoid)
      const bodyW = baseSize * 1.1;
      const bodyH = baseSize * 1.2;
      const bodyTop = -legH - bodyH;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-bodyW * 0.45, -legH);
      ctx.lineTo(-bodyW * 0.38, bodyTop);
      ctx.quadraticCurveTo(0, bodyTop - bodyH * 0.1, bodyW * 0.38, bodyTop);
      ctx.lineTo(bodyW * 0.45, -legH);
      ctx.closePath();
      ctx.fill();

      // Class icon on body
      const iconY = bodyTop + bodyH * 0.5;
      ctx.strokeStyle = '#fff';
      ctx.fillStyle = '#fff';
      ctx.lineWidth = Math.max(1, scale * 1.5);
      drawClassIcon(ctx, char.className, 0, iconY, baseSize * 0.3);

      // Head (round like reference)
      const headR = baseSize * 0.5;
      const headY = bodyTop - headR * 0.7;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, headY, headR, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-headR * 0.3, headY - headR * 0.1, headR * 0.15, 0, Math.PI * 2);
      ctx.arc(headR * 0.3, headY - headR * 0.1, headR * 0.15, 0, Math.PI * 2);
      ctx.fill();

      // Weapon line
      drawWeapon(ctx, char.className, bodyW, bodyTop, baseSize, color);

      ctx.restore();

      // HP bar above character
      if (char.alive && (deathProgress === undefined)) {
        const hpRatio = Math.max(0, (char.hp || 0) / (char.maxHP || char.stats?.maxHP || 1));
        const barW = baseSize * 2;
        const barH = Math.max(2, baseSize * 0.15);
        const barY = qvY - baseSize * 3.2;
        ctx.fillStyle = '#333';
        ctx.fillRect(qvX - barW/2, barY, barW, barH);
        const hpColor = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e94560';
        ctx.fillStyle = hpColor;
        ctx.fillRect(qvX - barW/2, barY, barW * hpRatio, barH);
      }

      // Name label below shadow (not affected by death transform)
      if (deathProgress === undefined || deathProgress < 0.8) {
        const isMobile = canvas.width < 400;
        const fontSize = Math.max(8, Math.round((isMobile ? 9 : 11) * scale));
        ctx.fillStyle = '#fff';
        ctx.font = `${fontSize}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.globalAlpha = deathProgress !== undefined ? Math.max(0, 1 - deathProgress) : (char.alive ? 1 : 0.3);
        ctx.fillText(char.name, qvX, qvY + baseSize * 0.8);
        ctx.globalAlpha = 1;
      }
    }

    function drawClassIcon(ctx, className, x, y, size) {
      ctx.save();
      ctx.translate(x, y);
      switch (className) {
        case '전사': // Sword cross
          ctx.beginPath();
          ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
          ctx.moveTo(0, -size); ctx.lineTo(0, size);
          ctx.stroke();
          break;
        case '마법사': // Star/asterisk
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
            ctx.stroke();
          }
          break;
        case '도적': // Diagonal slash
          ctx.beginPath();
          ctx.moveTo(-size, size * 0.5);
          ctx.lineTo(size, -size * 0.5);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-size * 0.5, size);
          ctx.lineTo(size * 0.5, -size);
          ctx.stroke();
          break;
        case '기사': // Shield outline
          ctx.strokeRect(-size * 0.6, -size * 0.7, size * 1.2, size * 1.4);
          ctx.beginPath();
          ctx.moveTo(0, -size * 0.4); ctx.lineTo(0, size * 0.4);
          ctx.moveTo(-size * 0.3, 0); ctx.lineTo(size * 0.3, 0);
          ctx.stroke();
          break;
        case '궁수': // Arrow/triangle pointing right
          ctx.beginPath();
          ctx.moveTo(-size * 0.5, -size * 0.6);
          ctx.lineTo(size * 0.7, 0);
          ctx.lineTo(-size * 0.5, size * 0.6);
          ctx.closePath();
          ctx.stroke();
          break;
      }
      ctx.restore();
    }

    function drawWeapon(ctx, className, bodyW, bodyTop, baseSize, color) {
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = Math.max(1, baseSize * 0.1);
      const weaponLen = baseSize * 0.9;
      switch (className) {
        case '전사': // Sword right
          ctx.beginPath();
          ctx.moveTo(bodyW * 0.45, bodyTop + baseSize * 0.3);
          ctx.lineTo(bodyW * 0.45 + weaponLen, bodyTop);
          ctx.stroke();
          break;
        case '마법사': // Staff up
          ctx.beginPath();
          ctx.moveTo(bodyW * 0.4, bodyTop + baseSize * 0.5);
          ctx.lineTo(bodyW * 0.35, bodyTop - baseSize * 0.8);
          ctx.stroke();
          // Orb at top
          ctx.fillStyle = '#7ec8e3';
          ctx.beginPath();
          ctx.arc(bodyW * 0.35, bodyTop - baseSize * 0.9, baseSize * 0.15, 0, Math.PI * 2);
          ctx.fill();
          break;
        case '도적': // Dagger
          ctx.beginPath();
          ctx.moveTo(bodyW * 0.4, bodyTop + baseSize * 0.4);
          ctx.lineTo(bodyW * 0.4 + weaponLen * 0.6, bodyTop + baseSize * 0.1);
          ctx.stroke();
          break;
        case '기사': // Shield on left, sword right
          // Shield
          ctx.fillStyle = darkenColor(color, 0.6);
          ctx.fillRect(-bodyW * 0.5 - baseSize * 0.3, bodyTop + baseSize * 0.1, baseSize * 0.35, baseSize * 0.5);
          // Sword
          ctx.beginPath();
          ctx.moveTo(bodyW * 0.45, bodyTop + baseSize * 0.3);
          ctx.lineTo(bodyW * 0.45 + weaponLen * 0.8, bodyTop);
          ctx.stroke();
          break;
        case '궁수': // Bow (curved)
          ctx.beginPath();
          ctx.moveTo(-bodyW * 0.4, bodyTop + baseSize * 0.1);
          ctx.quadraticCurveTo(-bodyW * 0.4 - baseSize * 0.4, bodyTop + baseSize * 0.5, -bodyW * 0.4, bodyTop + baseSize * 0.9);
          ctx.stroke();
          // Arrow
          ctx.beginPath();
          ctx.moveTo(-bodyW * 0.35, bodyTop + baseSize * 0.5);
          ctx.lineTo(-bodyW * 0.35 - weaponLen * 0.8, bodyTop + baseSize * 0.5);
          ctx.stroke();
          break;
      }
    }

    function darkenColor(hex, factor) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.round(r * factor)},${Math.round(g * factor)},${Math.round(b * factor)})`;
    }

    // ─── Task 5: Animation system ───
    function spawnDamageNumber(x, y, amount, isSkill, isCrit) {
      animations.push({
        type: 'damage',
        x, y,
        startY: y,
        amount: isCrit ? amount + ' CRIT!' : amount,
        isSkill,
        isCrit: !!isCrit,
        born: performance.now(),
        duration: isCrit ? 1200 : 1000,
      });
    }

    // ─── Task 6: Skill effect animations ───
    function spawnSkillName(x, y, skillName) {
      animations.push({
        type: 'skillName',
        x, y,
        startY: y,
        text: skillName,
        born: performance.now(),
        duration: 900,
      });
    }

    function spawnAoeEffect(x, y, color) {
      animations.push({
        type: 'aoe',
        x, y,
        color,
        born: performance.now(),
        duration: 600,
      });
    }

    function spawnProjectile(fromX, fromY, toX, toY, color) {
      animations.push({
        type: 'projectile',
        fromX, fromY, toX, toY,
        color,
        born: performance.now(),
        duration: 400,
      });
    }

    function spawnBuffEffect(x, y, color) {
      animations.push({
        type: 'buff',
        x, y,
        color,
        born: performance.now(),
        duration: 700,
      });
    }

    // ─── Task 7: Death animation ───
    function spawnDeathEffect(x, y, color, charId) {
      // Death shrink/fade is handled by drawCharacter via deathAnims map
      deathAnims.set(charId, { born: performance.now(), duration: 800 });
      // Particle burst
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2 + Math.random() * 0.5;
        const speed = 30 + Math.random() * 40;
        animations.push({
          type: 'particle',
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          born: performance.now(),
          duration: 800,
        });
      }
    }
    const deathAnims = new Map(); // charId -> { born, duration }

    function drawEffect(ctx, effect, now) {
      const elapsed = now - effect.born;
      const t = Math.min(1, elapsed / effect.duration);
      const alpha = 1 - t;

      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);

      switch (effect.type) {
        case 'damage': {
          const isMobile = canvas.width < 400;
          const baseFontSize = effect.isCrit
            ? Math.max(14, Math.round(isMobile ? 18 : 22))
            : effect.isSkill
              ? Math.max(12, Math.round(isMobile ? 14 : 18))
              : Math.max(10, Math.round(isMobile ? 12 : 15));
          const fontSize = effect.isCrit ? baseFontSize * (1 + (1-t)*0.3) : baseFontSize;
          ctx.font = `bold ${Math.round(fontSize)}px sans-serif`;
          ctx.textAlign = 'center';
          const dy = -40 * t;
          const x = effect.x;
          const y = effect.startY + dy;
          // Outline for readability
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 3;
          ctx.strokeText(effect.amount, x, y);
          ctx.fillStyle = effect.isCrit ? '#ff6600' : effect.isSkill ? '#ffd700' : '#fff';
          ctx.fillText(effect.amount, x, y);
          break;
        }
        case 'skillName': {
          const fontSize = Math.max(10, Math.round(14));
          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.textAlign = 'center';
          const dy = -30 * t;
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeText(effect.text, effect.x, effect.startY + dy);
          ctx.fillStyle = '#7ec8e3';
          ctx.fillText(effect.text, effect.x, effect.startY + dy);
          break;
        }
        case 'aoe': {
          const maxR = 40;
          const r = maxR * t;
          ctx.strokeStyle = effect.color || '#7ec8e3';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case 'projectile': {
          const px = effect.fromX + (effect.toX - effect.fromX) * Math.min(1, t * 2.5);
          const py = effect.fromY + (effect.toY - effect.fromY) * Math.min(1, t * 2.5);
          ctx.fillStyle = effect.color || '#fff';
          ctx.beginPath();
          ctx.arc(px, py, 4, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 'buff': {
          const r = 15 + 10 * t;
          ctx.strokeStyle = effect.color || '#3498db';
          ctx.lineWidth = 2 + (1 - t) * 2;
          ctx.beginPath();
          ctx.arc(effect.x, effect.y, r, 0, Math.PI * 2);
          ctx.stroke();
          break;
        }
        case 'particle': {
          const px = effect.x + effect.vx * t;
          const py = effect.y + effect.vy * t;
          ctx.fillStyle = effect.color;
          ctx.fillRect(px - 2, py - 2, 4, 4);
          break;
        }
      }
      ctx.restore();
    }

    // ─── Main render frame ───
    function renderFrame() {
      const W = canvas.width;
      const H = canvas.height;
      const now = performance.now();
      const isMobile = W < 400;

      ctx.clearRect(0, 0, W, H);
      drawDiamondField(W, H);

      // Build sorted character list with quarter-view coords
      const totalChars = battleChars.length;
      const charsToDraw = battleChars.map((c, idx) => {
        const syntheticY = (idx / Math.max(1, totalChars)) * ARENA_HEIGHT * 0.6 + ARENA_HEIGHT * 0.2;
        const { qvX, qvY } = serverToQuarterView(c.x, syntheticY, W, H);
        const depthScale = getDepthScale(qvY, H, isMobile);
        return { char: c, qvX, qvY, depthScale };
      });

      // Painter's algorithm: sort by qvY (back to front)
      charsToDraw.sort((a, b) => a.qvY - b.qvY);

      for (const { char, qvX, qvY, depthScale } of charsToDraw) {
        // Check death animation progress
        let deathProgress;
        const da = deathAnims.get(char.id);
        if (da) {
          const dt = (now - da.born) / da.duration;
          if (dt < 1) {
            deathProgress = dt;
          }
          // After animation done, character renders as ghost via drawCharacter (!char.alive path)
        }
        drawCharacter(ctx, char, qvX, qvY, depthScale, deathProgress);
      }

      // Draw animations (effects, damage numbers, particles)
      for (let i = animations.length - 1; i >= 0; i--) {
        const anim = animations[i];
        if (now - anim.born > anim.duration) {
          animations.splice(i, 1);
          continue;
        }
        drawEffect(ctx, anim, now);
      }
    }

    function animationLoop() {
      renderFrame();
      if (isBattleActive) {
        animFrameId = requestAnimationFrame(animationLoop);
      }
    }

    // ─── Helper: find character qv position at snapshot time ───
    function getCharQV(charId) {
      const W = canvas.width;
      const H = canvas.height;
      const totalChars = battleChars.length;
      const idx = battleChars.findIndex(c => c.id === charId);
      if (idx < 0) return null;
      const c = battleChars[idx];
      const syntheticY = (idx / Math.max(1, totalChars)) * ARENA_HEIGHT * 0.6 + ARENA_HEIGHT * 0.2;
      return serverToQuarterView(c.x, syntheticY, W, H);
    }

    // ─── Socket events ───
    socket.on('battleStart', ({ totalTicks }) => {
      showScreen('battle-screen');
      resizeCanvas();
      battleChars = [];
      animations = [];
      deathAnims.clear();
      deadAnimated.clear();
      isBattleActive = true;
      document.getElementById('tickInfo').textContent = `총 ${totalTicks}틱`;
      animFrameId = requestAnimationFrame(animationLoop);
    });

    socket.on('battleTick', (data) => {
      battleChars = data.state;

      // Update HP bars
      const hpEl = document.getElementById('hpBars');
      hpEl.innerHTML = battleChars.map(c => {
        const pct = Math.max(0, c.hp / c.maxHP * 100);
        const color = c.alive ? (classColors[c.className] || '#e94560') : '#555';
        return `<div class="hp-bar-container">
          <div class="char-name" style="color:${color}">${esc(c.name)} (${esc(c.className || '?')})</div>
          <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="hp-text">${c.hp}/${c.maxHP}</div>
        </div>`;
      }).join('');

      if (data.tick !== null && data.tick !== undefined) {
        document.getElementById('tickInfo').textContent = `틱: ${data.tick}`;
      }

      // Process events (Task 5, 6, 7)
      const events = data.events || [];
      for (const evt of events) {
        switch (evt.type) {
          case 'damage': {
            if (evt.amount <= 0) break; // Skip fully-blocked (shield absorbed) hits
            // Snapshot position at spawn time
            const pos = getCharQV(evt.to);
            if (pos) {
              spawnDamageNumber(pos.qvX, pos.qvY - 20, evt.amount, !!evt.skill, !!evt.crit);
            }
            break;
          }
          case 'skill': {
            const casterPos = getCharQV(evt.caster);
            if (casterPos) {
              const casterColor = (() => {
                const c = battleChars.find(ch => ch.id === evt.caster);
                return c ? (classColors[c.className] || '#7ec8e3') : '#7ec8e3';
              })();
              // Skill name
              spawnSkillName(casterPos.qvX, casterPos.qvY - 40, evt.skillName);

              if (evt.aoe) {
                spawnAoeEffect(casterPos.qvX, casterPos.qvY, casterColor);
              } else if (evt.skillType === 'defense' || evt.skillType === 'buff') {
                spawnBuffEffect(casterPos.qvX, casterPos.qvY, casterColor);
              } else {
                // Single-target attack: find a target from damage events in same tick
                const dmgEvt = events.find(e => e.type === 'damage' && e.skill && e.from === evt.caster);
                if (dmgEvt) {
                  const targetPos = getCharQV(dmgEvt.to);
                  if (targetPos) {
                    spawnProjectile(casterPos.qvX, casterPos.qvY, targetPos.qvX, targetPos.qvY, casterColor);
                  }
                }
              }
            }
            break;
          }
          case 'death': {
            if (!deadAnimated.has(evt.target)) {
              deadAnimated.add(evt.target);
              const pos = getCharQV(evt.target);
              const c = battleChars.find(ch => ch.id === evt.target);
              const color = c ? (classColors[c.className] || '#e94560') : '#e94560';
              if (pos) {
                spawnDeathEffect(pos.qvX, pos.qvY, color, evt.target);
              }
            }
            break;
          }
        }
      }
    });

    // ─── 결과 ───
    socket.on('battleEnd', ({ results }) => {
      // Task 5: cleanup animation loop
      isBattleActive = false;
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
      animations = [];
      deathAnims.clear();
      deadAnimated.clear();

      showScreen('result-screen');
      const el = document.getElementById('resultCards');
      el.innerHTML = results.map(r => {
        const rankClass = r.rank <= 3 ? `rank-${r.rank}` : '';
        return `<div class="result-card">
          <div class="rank ${rankClass}">${r.rank}등</div>
          <div>
            <div style="font-weight:bold">${esc(r.name)} (${esc(r.className)})</div>
            <div style="color:#aaa">HP: ${r.hpRemaining}</div>
            <div class="reward-gold">+${r.reward.gold}G</div>
          </div>
        </div>`;
      }).join('');
    });

    function backToWorkshop() {
      isBattleActive = false;
      isSurvivalActive = false;
      if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
      if (survivalAnimFrameId) { cancelAnimationFrame(survivalAnimFrameId); survivalAnimFrameId = null; }
      animations = [];
      deathAnims.clear();
      deadAnimated.clear();
      survivalAnimations = [];
      const logEl = document.getElementById('survivalLog');
      if (logEl) logEl.style.display = 'none';
      showScreen((soloPlay || survivalPlay) ? 'lobby' : 'workshop');
      if (!soloPlay && !survivalPlay) initWorkshop();
    }

    // ═══ SURVIVAL ARENA ═══
    const survivalCanvas = document.getElementById('survival-canvas');
    const sCtx = survivalCanvas ? survivalCanvas.getContext('2d') : null;
    let survivalChars = [];
    let survivalAnimations = [];
    let survivalAnimFrameId = null;
    let isSurvivalActive = false;
    let survivalPhase = 1;
    let survivalActiveZones = [0,1,2,3];
    const survivalDeadAnimated = new Set();
    const survivalDeathAnims = new Map();
    const ZONE_COLORS = ['#e94560','#7b2ff7','#2ecc71','#f39c12'];
    const ZONE_LABELS = ['A','B','C','D'];
    // 카메라 시스템: 플레이어 캐릭터 중심 뷰포트
    let cameraX = 0; // camera center in server coords (0~1600)
    const CAMERA_SMOOTH = 0.1; // lerp factor
    const MAP_WIDTH = 1600;

    function resizeSurvivalCanvas() {
      if (!survivalCanvas) return;
      const container = survivalCanvas.parentElement;
      const style = getComputedStyle(container);
      const pad = parseFloat(style.paddingLeft || 0) + parseFloat(style.paddingRight || 0);
      const w = Math.min(800, container.clientWidth - Math.max(pad, 10));
      survivalCanvas.width = w;
      survivalCanvas.height = Math.round(w * 0.5);
    }
    const survivalSpeedBtn = document.getElementById('survivalSpeedBtn');
    if (survivalSpeedBtn) {
      survivalSpeedBtn.addEventListener('click', () => {
        const idx = (SPEED_OPTIONS.indexOf(playbackSpeed) + 1) % SPEED_OPTIONS.length;
        playbackSpeed = SPEED_OPTIONS[idx];
        survivalSpeedBtn.textContent = playbackSpeed + 'x';
        if (speedBtn) speedBtn.textContent = playbackSpeed + 'x';
        socket.emit('setSpeed', playbackSpeed);
      });
    }

    if (survivalCanvas) {
      resizeSurvivalCanvas();
      window.addEventListener('resize', () => {
        resizeSurvivalCanvas();
        if (survivalChars.length > 0 && !isSurvivalActive) renderSurvivalFrame();
      });
    }

    // ─── 쿼터뷰 그리드 맵 시스템 ───
    const GRID_COLS = 10;
    const GRID_ROWS = 6;
    const WALL_COLS = [3, 7]; // 벽 위치 (컬럼 인덱스)
    // 벽 X 매핑: col 3 → server x=550, col 7 → server x=1050
    const WALL_SERVER_X = [550, 1050];

    function getSurvivalDiamond(W, H) {
      return { cx: W/2, cy: H*0.55, dw: W*0.46, dh: H*0.40 };
    }

    // 그리드 셀의 쿼터뷰 꼭짓점 4개 계산
    function gridCellToIso(col, row, cx, cy, dw, dh) {
      const cellW = 2.0 / GRID_COLS;
      const cellH = 2.0 / GRID_ROWS;
      const x0 = col * cellW - 1;
      const y0 = row * cellH - 1;
      // 4 corners in normalized coords
      const corners = [
        [x0, y0], [x0 + cellW, y0],
        [x0 + cellW, y0 + cellH], [x0, y0 + cellH]
      ];
      return corners.map(([nx, ny]) => ({
        sx: cx + (nx - ny) * dw * 0.5,
        sy: cy + (nx + ny) * dh * 0.5
      }));
    }

    function drawSurvivalField(W, H) {
      sCtx.fillStyle = '#0a0a1e';
      sCtx.fillRect(0, 0, W, H);

      const { cx, cy, dw, dh } = getSurvivalDiamond(W, H);
      // Camera offset in grid space
      const camOffsetNorm = ((cameraX - MAP_WIDTH/2) / (MAP_WIDTH/2));

      // Draw grid cells
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
          const pts = gridCellToIso(c, r, cx, cy, dw, dh);
          // Apply camera offset
          const camShift = -camOffsetNorm * dw * 0.5;
          const shifted = pts.map(p => ({ sx: p.sx + camShift, sy: p.sy }));

          const isWall = WALL_COLS.includes(c);

          sCtx.beginPath();
          sCtx.moveTo(shifted[0].sx, shifted[0].sy);
          for (let i = 1; i < 4; i++) sCtx.lineTo(shifted[i].sx, shifted[i].sy);
          sCtx.closePath();

          if (isWall) {
            // 벽 셀: 진한 색 + 빗금 패턴
            sCtx.fillStyle = '#1a0a0a';
            sCtx.fill();
            sCtx.strokeStyle = '#e94560';
            sCtx.lineWidth = 2;
            sCtx.stroke();
            // X 패턴
            sCtx.strokeStyle = 'rgba(233,69,96,0.4)';
            sCtx.lineWidth = 1;
            sCtx.beginPath();
            sCtx.moveTo(shifted[0].sx, shifted[0].sy);
            sCtx.lineTo(shifted[2].sx, shifted[2].sy);
            sCtx.moveTo(shifted[1].sx, shifted[1].sy);
            sCtx.lineTo(shifted[3].sx, shifted[3].sy);
            sCtx.stroke();
          } else {
            // 일반 셀
            const zone = c < WALL_COLS[0] ? 0 : c < WALL_COLS[1] ? 1 : 2;
            const zoneColors = ['#0f2847', '#0d2040', '#0f2847'];
            sCtx.fillStyle = zoneColors[zone];
            sCtx.fill();
            sCtx.strokeStyle = '#1a3a5c';
            sCtx.lineWidth = 0.5;
            sCtx.stroke();
          }
        }
      }
    }

    function serverToSurvivalQV(serverX, charIdx, totalChars, W, H) {
      const { cx, cy, dw, dh } = getSurvivalDiamond(W, H);
      // Camera viewport
      const camOffsetNorm = ((cameraX - MAP_WIDTH/2) / (MAP_WIDTH/2));
      const camShift = -camOffsetNorm * dw * 0.5;

      // Server X → normalized grid position
      const normX = (serverX / MAP_WIDTH) * 2 - 1;
      // Spread characters on Y based on index
      const normY = totalChars > 1 ? ((charIdx / (totalChars - 1)) * 2 - 1) * 0.5 : 0;

      // Isometric projection + camera
      const qvX = cx + (normX - normY) * dw * 0.5 + camShift;
      const qvY = cy + (normX + normY) * dh * 0.5;
      return { qvX, qvY };
    }

    function renderSurvivalFrame() {
      if (!sCtx) return;
      const W = survivalCanvas.width;
      const H = survivalCanvas.height;
      const now = performance.now();
      const isMobile = W < 400;

      // Update camera: follow player p0
      const playerChar = survivalChars.find(c => c.id === 'p0');
      if (playerChar) {
        const targetCam = Math.max(400, Math.min(MAP_WIDTH - 400, playerChar.x));
        cameraX += (targetCam - cameraX) * CAMERA_SMOOTH;
      }

      sCtx.clearRect(0, 0, W, H);
      drawSurvivalField(W, H);

      // Walls are already drawn as grid cells in drawSurvivalField

      // Sort and draw characters
      const chars = survivalChars.filter(c => c.alive || survivalDeathAnims.has(c.id));
      const totalChars = chars.length;

      // Sort by y for painter's algorithm (isometric)
      const toDraw = chars.map((c, idx) => {
        const { qvX, qvY } = serverToSurvivalQV(c.x, idx, totalChars, W, H);
        return { char: c, qvX, qvY };
      }).sort((a, b) => a.qvY - b.qvY);

      for (const { char, qvX, qvY } of toDraw) {
        const mobileScale = isMobile ? 0.7 : 1.0;
        const scale = (char.isMonster ? 0.6 : 0.8) * mobileScale;
        let deathProgress;
        const da = survivalDeathAnims.get(char.id);
        if (da) {
          const dt = (now - da.born) / da.duration;
          if (dt < 1) deathProgress = dt;
        }

        if (char.isMonster) {
          // Draw monster as triangle
          drawMonster(sCtx, char, qvX, qvY, scale, deathProgress);
        } else {
          drawCharacter(sCtx, char, qvX, qvY, scale, deathProgress);
        }
      }

      // Minimap (top-left corner, bigger on mobile)
      const mmW = isMobile ? Math.min(W * 0.28, 90) : W * 0.2;
      const mmH = isMobile ? 20 : H * 0.12;
      const mmX = 6;
      const mmY = 6;
      sCtx.fillStyle = 'rgba(0,0,0,0.5)';
      sCtx.fillRect(mmX, mmY, mmW, mmH);
      sCtx.strokeStyle = 'rgba(255,255,255,0.3)';
      sCtx.lineWidth = 1;
      sCtx.strokeRect(mmX, mmY, mmW, mmH);
      // Minimap walls (filled blocks)
      for (const wallX of WALL_SERVER_X) {
        const wx = mmX + (wallX / MAP_WIDTH) * mmW;
        const ww = mmW / GRID_COLS;
        sCtx.fillStyle = 'rgba(233,69,96,0.4)';
        sCtx.fillRect(wx - ww/2, mmY, ww, mmH);
      }
      // Minimap viewport indicator
      const vpLeft = mmX + ((cameraX - 400) / MAP_WIDTH) * mmW;
      const vpW = (800 / MAP_WIDTH) * mmW;
      sCtx.strokeStyle = 'rgba(255,255,255,0.5)';
      sCtx.strokeRect(Math.max(mmX, vpLeft), mmY, Math.min(vpW, mmW), mmH);
      // Minimap characters (dots)
      for (const c of survivalChars) {
        if (!c.alive) continue;
        const dotX = mmX + (c.x / MAP_WIDTH) * mmW;
        const dotY = mmY + mmH * 0.5;
        sCtx.fillStyle = c.isMonster ? (c.isBoss ? '#ff0000' : '#ff8800') : (classColors[c.className] || '#fff');
        const dotR = c.isMonster ? (c.isBoss ? 3 : 1.5) : 2.5;
        sCtx.beginPath();
        sCtx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
        sCtx.fill();
      }

      // Draw animations
      for (let i = survivalAnimations.length - 1; i >= 0; i--) {
        const anim = survivalAnimations[i];
        if (now - anim.born > anim.duration) {
          survivalAnimations.splice(i, 1);
          continue;
        }
        drawEffect(sCtx, anim, now);
      }
    }

    function drawMonster(ctx, char, qvX, qvY, scale, deathProgress) {
      const size = 10 * scale;
      ctx.save();
      ctx.translate(qvX, qvY);

      if (deathProgress !== undefined) {
        ctx.globalAlpha = Math.max(0, 1 - deathProgress);
        ctx.scale(1 - deathProgress * 0.7, 1 - deathProgress * 0.7);
      } else if (!char.alive) {
        ctx.globalAlpha = 0.2;
      }

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 0, size, size * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();

      // Monster body (inverted triangle - menacing)
      const lvColor = char.level >= 4 ? '#ff4444' : char.level >= 3 ? '#ff8800' : char.level >= 2 ? '#ffcc00' : '#88cc44';
      ctx.fillStyle = lvColor;
      ctx.beginPath();
      ctx.moveTo(-size, -size * 1.5);
      ctx.lineTo(size, -size * 1.5);
      ctx.lineTo(0, size * 0.3);
      ctx.closePath();
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-size * 0.3, -size * 0.8, size * 0.15, 0, Math.PI * 2);
      ctx.arc(size * 0.3, -size * 0.8, size * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // HP bar above monster
      if (char.alive && deathProgress === undefined) {
        const hpRatio = Math.max(0, (char.hp || 0) / (char.maxHP || 1));
        const barW = size * 2;
        const barH = Math.max(2, size * 0.2);
        const barY = qvY - size * 2.2;
        ctx.fillStyle = '#333';
        ctx.fillRect(qvX - barW/2, barY, barW, barH);
        ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e94560';
        ctx.fillRect(qvX - barW/2, barY, barW * hpRatio, barH);
      }

      // Level label
      if (deathProgress === undefined || deathProgress < 0.5) {
        ctx.fillStyle = '#aaa';
        ctx.font = `${Math.max(7, Math.round(8 * scale))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.globalAlpha = deathProgress !== undefined ? Math.max(0, 1 - deathProgress) : (char.alive ? 0.7 : 0.2);
        ctx.fillText(`Lv${char.level || '?'}`, qvX, qvY + size * 1.2);
        ctx.globalAlpha = 1;
      }
    }

    function survivalAnimLoop() {
      renderSurvivalFrame();
      if (isSurvivalActive) {
        survivalAnimFrameId = requestAnimationFrame(survivalAnimLoop);
      }
    }

    function survivalLogAdd(text) {
      const el = document.getElementById('survivalLog');
      if (!el) return;
      const entry = document.createElement('div');
      entry.className = 'survival-log-entry';
      entry.textContent = text;
      el.appendChild(entry);
      el.scrollTop = el.scrollHeight;
      // Keep max 30 entries
      while (el.children.length > 30) el.removeChild(el.firstChild);
    }

    function survivalNotify(text, color) {
      const el = document.getElementById('survivalNotify');
      if (!el) return;
      const item = document.createElement('div');
      item.className = 'survival-notify-item';
      item.style.color = color || '#7ec8e3';
      item.style.borderColor = color || '#7ec8e3';
      item.textContent = text;
      el.appendChild(item);
      setTimeout(() => item.remove(), 2100);
    }

    // ─── Survival Socket Events ───
    socket.on('survivalStart', ({ totalTicks }) => {
      showScreen('survival-screen');
      resizeSurvivalCanvas();
      survivalChars = [];
      survivalAnimations = [];
      survivalDeathAnims.clear();
      survivalDeadAnimated.clear();
      survivalPhase = 1;
      survivalActiveZones = [0,1,2,3];
      isSurvivalActive = true;
      const sti = document.getElementById('survivalTickInfo');
      if (sti) sti.textContent = `총 ${totalTicks}틱`;
      const logEl = document.getElementById('survivalLog');
      if (logEl) { logEl.style.display = ''; logEl.innerHTML = ''; }
      survivalAnimFrameId = requestAnimationFrame(survivalAnimLoop);
    });

    socket.on('survivalTick', (data) => {
      survivalChars = data.state;
      survivalPhase = data.phase || 1;
      survivalActiveZones = data.activeZones || [0,1,2,3];

      // Update HUD
      const player = survivalChars.find(c => c.id === 'p0');
      if (player) {
        document.getElementById('survivalGold').textContent = `💰 ${player.gold || 0}G`;
        const enh = player.enhancementLevels;
        if (enh) {
          const slots = { helmet:'투구', armor:'갑옷', weapon:'무기', boots:'신발' };
          for (const [k, label] of Object.entries(slots)) {
            const el = document.getElementById('enh-' + k);
            if (el) { el.textContent = label + (enh[k]||0); el.style.borderColor = enh[k] >= 3 ? '#e94560' : enh[k] >= 2 ? '#f0a500' : enh[k] >= 1 ? '#7ec8e3' : '#444'; }
          }
        }
      }

      const elapsed = (data.tick || 0) * 0.2;
      const remaining = Math.max(0, 300 - elapsed);
      const min = Math.floor(remaining / 60);
      const sec = Math.floor(remaining % 60);
      document.getElementById('survivalTimer').textContent = `${min}:${sec.toString().padStart(2,'0')}`;

      const phaseLabels = { 1: 'Phase 1 - PvE', 2: 'Phase 2 - 합류', 3: 'Phase 3 - FFA' };
      document.getElementById('survivalPhase').textContent = phaseLabels[survivalPhase] || '';

      if (data.tick) { const sti2 = document.getElementById('survivalTickInfo'); if (sti2) sti2.textContent = `틱: ${data.tick}`; }

      // HP bars: 하단 4명 카드 레이아웃
      const players = survivalChars.filter(c => !c.isMonster);
      const hpEl = document.getElementById('survivalHpBars');
      hpEl.innerHTML = players.map(c => {
        const pct = Math.max(0, c.hp / c.maxHP * 100);
        const color = c.alive ? (classColors[c.className] || '#e94560') : '#555';
        const lives = c.livesRemaining != null ? c.livesRemaining : '?';
        const chaos = (c.chaos || 0) > 0 ? `<span style="color:#ff4444;font-size:0.8em"> 🔥${c.chaos}</span>` : '';
        const isMe = c.id === 'p0';
        const border = isMe ? 'border:1px solid #e94560' : '';
        return `<div class="survival-hp-card ${c.alive ? '' : 'dead'}" style="${border}">
          <div class="hp-name" style="color:${color}">${esc(c.name)}${chaos}</div>
          <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${pct}%;background:${color}"></div></div>
          <div class="hp-info">${c.hp}/${c.maxHP} | ♥${lives}</div>
        </div>`;
      }).join('');

      // Process events
      const events = data.events || [];
      for (const evt of events) {
        if (evt.type === 'damage' && evt.amount > 0) {
          const aliveChars = survivalChars.filter(c => c.alive || survivalDeathAnims.has(c.id));
          const targetIdx = aliveChars.findIndex(c => c.id === evt.to);
          const target = aliveChars[targetIdx];
          if (target && targetIdx >= 0) {
            const { qvX, qvY } = serverToSurvivalQV(target.x, targetIdx, aliveChars.length, survivalCanvas.width, survivalCanvas.height);
            survivalAnimations.push({ type:'damage', x:qvX, y:qvY-15, startY:qvY-15, amount:evt.amount, isSkill:!!evt.skill, isCrit:!!evt.crit, born:performance.now(), duration:evt.crit?1200:1000 });
          }
        }
        if (evt.type === 'death' && !survivalDeadAnimated.has(evt.target)) {
          survivalDeadAnimated.add(evt.target);
          const aliveChars = survivalChars.filter(c => c.alive || survivalDeathAnims.has(c.id));
          const cIdx = aliveChars.findIndex(ch => ch.id === evt.target);
          const c = aliveChars[cIdx];
          if (c && cIdx >= 0) {
            const { qvX, qvY } = serverToSurvivalQV(c.x, cIdx, aliveChars.length, survivalCanvas.width, survivalCanvas.height);
            survivalDeathAnims.set(evt.target, { born:performance.now(), duration:800 });
            if (!c.isMonster) survivalNotify(`${c.name} 사망!`, '#e94560');
          }
        }
        if (evt.type === 'drop') {
          const slotNames = { helmet:'투구', armor:'갑옷', weapon:'무기', boots:'신발' };
          if (evt.dropType === 'enhancement') {
            survivalNotify(`${slotNames[evt.slot] || evt.slot} +${evt.level} 강화!`, '#f0a500');
          } else if (evt.dropType === 'goldOverflow') {
            survivalNotify(`+${evt.gold}G (${slotNames[evt.slot]} MAX)`, '#f0a500');
          } else if (evt.dropType === 'goldEnhance') {
            survivalNotify(`골드 강화: ${slotNames[evt.slot]} +${evt.level}`, '#7ec8e3');
          } else if (evt.dropType === 'playerKill') {
            survivalNotify(`⚔ ${evt.victimName} 처치! +${evt.gold}G${evt.stolenSlot ? ' +' + (slotNames[evt.stolenSlot]||evt.stolenSlot) + ' 탈취' : ''}`, '#ff4444');
          }
        }
        if (evt.type === 'waveSpawn') {
          survivalNotify(`⚔ Wave 몬스터 출현!`, '#ff6644');
        }
        if (evt.type === 'zoneMerge') {
          survivalNotify(`🔥 존 합류! Phase ${evt.phase}`, '#e94560');
        }
        if (evt.type === 'bossSpawn') {
          survivalNotify(`🐉 최종보스 ${evt.name} 출현! HP:${evt.hp}`, '#ff0000');
          survivalLogAdd(`🐉 최종보스 ${evt.name} 출현!`);
        }
        if (evt.type === 'bossKill') {
          survivalNotify(`👑 ${evt.killerName}이(가) 보스를 처치! 승리!`, '#ffd700');
          survivalLogAdd(`👑 ${evt.killerName} 보스 처치! 승리!`);
        }
        if (evt.type === 'respawnQueued') {
          survivalNotify(`💀 ${evt.playerName} 사망! ${evt.respawnIn}초 후 부활 (♥${evt.livesRemaining})`, '#ff8800');
          survivalLogAdd(`💀 ${evt.playerName} 사망 (♥${evt.livesRemaining})`);
        }
        if (evt.type === 'respawn') {
          survivalNotify(`✨ ${evt.playerName} 부활! (♥${evt.livesRemaining})`, '#2ecc71');
          survivalLogAdd(`✨ ${evt.playerName} 부활`);
        }
        if (evt.type === 'wallBreak') {
          survivalNotify(`🧱 ${evt.label} 붕괴! 새로운 영역 개방!`, '#e94560');
          survivalLogAdd(`🧱 ${evt.label} 붕괴!`);
        }
      }
    });

    socket.on('survivalEnd', ({ results }) => {
      isSurvivalActive = false;
      if (survivalAnimFrameId) { cancelAnimationFrame(survivalAnimFrameId); survivalAnimFrameId = null; }
      survivalAnimations = [];
      survivalDeathAnims.clear();
      survivalDeadAnimated.clear();
      const logEl = document.getElementById('survivalLog');
      if (logEl) logEl.style.display = 'none';

      showScreen('result-screen');
      const el = document.getElementById('resultCards');
      el.innerHTML = results.map(r => {
        const rankClass = r.rank <= 3 ? `rank-${r.rank}` : '';
        const enh = r.enhancementLevels || {};
        const enhTotal = Object.values(enh).reduce((a,b)=>a+b, 0);
        const bossTag = r.bossKiller ? '<div style="color:#ffd700;font-weight:bold">👑 보스 처치자!</div>' : '';
        return `<div class="result-card">
          <div class="rank ${rankClass}">${r.rank}등</div>
          <div>
            <div style="font-weight:bold">${esc(r.name)} (${esc(r.className)})</div>
            ${bossTag}
            <div style="color:#aaa">HP: ${r.hpRemaining} | 킬: ${r.monstersKilled || 0}마리 | 목숨: ${r.livesRemaining != null ? r.livesRemaining : '?'}</div>
            <div style="color:#f0a500">강화 Lv${enhTotal} (${enh.helmet||0}/${enh.armor||0}/${enh.weapon||0}/${enh.boots||0})</div>
            <div style="color:#f0a500">+${r.gold || 0}G</div>
          </div>
        </div>`;
      }).join('');
    });

    socket.on('error', (msg) => alert(msg));
  </script>
</body>
</html>
