<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Battle Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 로딩 오버레이 -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    데이터 로딩중...
  </div>

  <!-- 로비 -->
  <div id="lobby">
    <div class="lobby-hero">
      <h1>Battle Arena</h1>
      <h3 class="lobby-subtitle">서바이벌 아레나</h3>
    </div>
    <input id="playerName" placeholder="닉네임" maxlength="10" value="">
    <div class="lobby-actions">
      <button class="btn" onclick="quickStart()">빠른 시작</button>
      <div id="roomList"></div>
      <button class="btn btn-secondary" onclick="createNewRoom()">+ 새 방 만들기</button>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="room-screen">
    <h2>대기실</h2>
    <div id="roomSlots" class="room-slots">
      <!-- 4 slot cards rendered by JS -->
    </div>
    <div class="room-start-actions">
      <button class="btn" id="startGameBtn" onclick="startGame()" disabled>시작!</button>
    </div>
  </div>

  <!-- 캐릭터 제작소: 랜덤 인생 -->
  <div id="workshop">
    <h2 class="workshop-title">🎲 랜덤 인생</h2>
    <div id="workshopBudget">
      <div class="gold-display">💰 <span id="goldDisplay">1000</span>G</div>
      <div class="reroll-display">🔄 리롤: <span id="rerollCount">10</span></div>
    </div>

    <!-- 단계별 위저드 -->
    <div class="shop-section" id="wizardStep">
      <div id="wizardContent"></div>
      <div id="wizardActions" class="wizard-actions">
        <button class="btn btn-secondary" id="rerollBtn" onclick="wizardReroll()">🔄 리롤</button>
        <button class="btn" id="confirmBtn" onclick="wizardConfirm()">✅ 확정</button>
      </div>
      <div id="wizardTimer" class="wizard-timer"></div>
    </div>

    <!-- 레이더 차트 -->
    <div class="shop-section radar-section" id="radarSection" style="display:none">
      <canvas id="statRadar" width="220" height="220"></canvas>
    </div>

    <div id="workshopCta" style="display:none">
      <button class="btn workshop-submit-btn" id="submitBtn" onclick="submitBuild()">⚔️ 출전!</button>
    </div>
  </div>

  <!-- 전투 화면 -->
  <div id="battle-screen">
    <div class="battle-header">
      <h2 class="battle-title">전투 진행중</h2>
      <button class="btn btn-secondary battle-speed-btn" id="speedBtn">1x</button>
      <button class="btn btn-secondary battle-speed-btn" id="mute-btn" onclick="SoundEngine.toggleMute()">🔊</button>
    </div>
    <div class="hp-bars" id="hpBars"></div>
    <canvas id="battle-canvas"></canvas>
    <div id="tickInfo" class="tick-info"></div>
  </div>

  <!-- 서바이벌 전투 화면 -->
  <div id="survival-screen">
    <div id="survivalHud">
      <div class="survival-hud-row">
        <div class="survival-timer" id="survivalTimer">5:00</div>
        <div class="survival-phase" id="survivalPhase">Phase 1 - PvE</div>
        <button class="btn btn-secondary survival-speed-btn" id="survivalSpeedBtn">1x</button>
        <button class="btn btn-secondary survival-speed-btn" id="mute-btn-survival" onclick="SoundEngine.toggleMute()">🔊</button>
      </div>
      <div class="survival-hud-row">
        <div class="survival-gold" id="survivalGold">💰 0G</div>
        <div id="survivalEnhance" class="enhance-badges">
          <span class="enhance-badge" id="enh-helmet">투구0</span>
          <span class="enhance-badge" id="enh-armor">갑옷0</span>
          <span class="enhance-badge" id="enh-weapon">무기0</span>
          <span class="enhance-badge" id="enh-boots">신발0</span>
        </div>
      </div>
    </div>
    <div id="survivalTickInfo" class="survival-tick-info"></div>
    <div id="killFeed" class="kill-feed"></div>
    <div class="survival-canvas-wrap">
      <canvas id="survival-canvas"></canvas>
    </div>
    <!-- HP바: 하단 4명 일렬 -->
    <div id="survivalHpBars" class="survival-hp-bottom"></div>
    <!-- 전투 로그 -->
    <div class="survival-log-wrap">
      <div id="survivalLog" class="survival-log"></div>
    </div>
    <!-- PvP 성향 전환 -->
    <div class="pvp-stance-bar">
      <button class="pvp-stance-btn" id="stancePassive" onclick="setPvpStance('passive')">🤝 협력</button>
      <button class="pvp-stance-btn active" id="stanceRetaliate" onclick="setPvpStance('retaliate')">🔄 반격</button>
      <button class="pvp-stance-btn" id="stanceHostile" onclick="setPvpStance('hostile')">⚔️ 적대</button>
    </div>
    <!-- 시그널 색상 -->
    <div class="signal-color-bar">
      <span class="signal-label">시그널:</span>
      <button class="signal-btn active" data-color="none" onclick="setSignalColor('none')" style="background:#555">✕</button>
      <button class="signal-btn" data-color="red" onclick="setSignalColor('red')" style="background:#e94560"></button>
      <button class="signal-btn" data-color="blue" onclick="setSignalColor('blue')" style="background:#3498db"></button>
      <button class="signal-btn" data-color="green" onclick="setSignalColor('green')" style="background:#2ecc71"></button>
      <button class="signal-btn" data-color="yellow" onclick="setSignalColor('yellow')" style="background:#f0a500"></button>
      <button class="signal-btn" data-color="purple" onclick="setSignalColor('purple')" style="background:#a855f7"></button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen">
    <h2>전투 결과</h2>
    <div id="resultCards"></div>
    <div id="battleStats" class="battle-stats"></div>
    <button class="btn result-lobby-btn" onclick="backToLobby()">로비로 돌아가기</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/workshop.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/survival.js"></script>
</body>
</html>
