<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Battle Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 로딩 오버레이 -->
  <div id="loading-overlay">데이터 로딩중...</div>

  <!-- 로비 -->
  <div id="lobby">
    <h1>Battle Arena</h1>
    <input id="playerName" placeholder="닉네임" maxlength="10" value="">
    <div style="margin:15px auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:400px">
      <button class="btn" onclick="createRoom()">방 만들기</button>
      <button class="btn btn-secondary" onclick="refreshRooms()">방 목록</button>
      <button class="btn" onclick="soloMode()" style="background:#0f3460;border:1px solid #7ec8e3">혼자 연습 (vs AI)</button>
      <button class="btn" onclick="survivalMode()" style="background:#2d1b69;border:1px solid #e94560">서바이벌 아레나</button>
    </div>
    <div id="roomList"></div>
  </div>

  <!-- 캐릭터 제작소 -->
  <div id="workshop">
    <h2 style="padding:12px 0 4px">캐릭터 제작</h2>
    <div id="workshopBudget">
      <div class="gold-display">💰 <span id="goldDisplay">1000</span>G</div>
      <div class="points-display">포인트: <span id="pointsDisplay">10</span></div>
    </div>

    <!-- 병과 선택 -->
    <div class="shop-section">
      <h3>병과 선택</h3>
      <div class="item-grid" id="classGrid"></div>
    </div>

    <!-- 스탯 배분 -->
    <div class="shop-section">
      <h3>스탯 배분 (10포인트)</h3>
      <div id="statSliders"></div>
    </div>

    <!-- 장비 상점 -->
    <div class="shop-section">
      <h3>투구</h3>
      <div class="item-grid" id="helmetGrid"></div>
    </div>
    <div class="shop-section">
      <h3>갑옷</h3>
      <div class="item-grid" id="armorGrid"></div>
    </div>
    <div class="shop-section">
      <h3>무기</h3>
      <div class="item-grid" id="weaponGrid"></div>
    </div>
    <div class="shop-section">
      <h3>신발</h3>
      <div class="item-grid" id="bootsGrid"></div>
    </div>

    <!-- 스킬 선택 -->
    <div class="shop-section">
      <h3>스킬 선택 (4개 중 3개)</h3>
      <div class="skill-select" id="skillSelect"></div>
    </div>

    <div style="margin: 8px auto; width: 95%; max-width: 800px;">
      <div class="player-list" id="playerList"></div>
    </div>
    <div id="workshopCta">
      <button class="btn" id="submitBtn" onclick="submitBuild()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;font-weight:bold">출전!</button>
      <button class="btn" id="aiBtn" onclick="fightAI()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;background:#0f3460;border:1px solid #7ec8e3">AI와 전투</button>
      <button class="btn" id="survivalBtn" onclick="startSurvival()" disabled style="display:none;width:100%;font-size:1.1em;padding:14px;background:#2d1b69;border:1px solid #e94560">서바이벌 시작</button>
    </div>
  </div>

  <!-- 전투 화면 -->
  <div id="battle-screen">
    <div style="display:flex;align-items:center;gap:10px;margin:10px auto;width:100%;max-width:800px">
      <h2 style="margin:0">전투 진행중</h2>
      <button class="btn btn-secondary" id="speedBtn" style="padding:6px 12px;font-size:13px">1x</button>
    </div>
    <div class="hp-bars" id="hpBars"></div>
    <canvas id="battle-canvas"></canvas>
    <div id="tickInfo" style="margin:10px auto;color:#aaa;width:100%;max-width:800px;text-align:center"></div>
  </div>

  <!-- 서바이벌 전투 화면 -->
  <div id="survival-screen">
    <div id="survivalHud">
      <div class="survival-hud-row">
        <div class="survival-timer" id="survivalTimer">5:00</div>
        <div class="survival-phase" id="survivalPhase">Phase 1 - PvE</div>
        <button class="btn btn-secondary" id="survivalSpeedBtn" style="padding:6px 12px;font-size:13px">1x</button>
      </div>
      <div class="survival-hud-row">
        <div class="survival-gold" id="survivalGold">💰 0G</div>
        <div id="survivalEnhance" class="enhance-badges">
          <span class="enhance-badge" id="enh-helmet">투구0</span>
          <span class="enhance-badge" id="enh-armor">갑옷0</span>
          <span class="enhance-badge" id="enh-weapon">무기0</span>
          <span class="enhance-badge" id="enh-boots">신발0</span>
        </div>
      </div>
    </div>
    <div id="survivalTickInfo" class="survival-tick-info"></div>
    <div style="position:relative;width:100%;max-width:800px">
      <canvas id="survival-canvas"></canvas>
    </div>
    <!-- HP바: 하단 4명 일렬 -->
    <div id="survivalHpBars" class="survival-hp-bottom"></div>
    <!-- 전투 로그 (필터 포함) -->
    <div class="survival-log-wrap">
      <div class="log-filters" id="logFilters">
        <button class="log-filter-btn active" data-filter="all">전체</button>
      </div>
      <div id="survivalLog" class="survival-log"></div>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen">
    <h2>전투 결과</h2>
    <div id="resultCards"></div>
    <button class="btn" onclick="backToWorkshop()" style="margin-top:20px">다시 출전</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/app.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/workshop.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/survival.js"></script>
</body>
</html>
